version: '3.8'
services:
  ecorecicla-db:
    image: postgres:15-alpine
    container_name: ecorecicla-postgres
    environment:
      - POSTGRES_DB=ecorecicla
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: 
