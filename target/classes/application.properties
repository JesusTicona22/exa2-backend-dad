spring.application.name=EcoAPI
server.port=8080

# Conexión a PostgreSQL en Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/ecorecicla
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate (update para crear tablas automático como querías)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT - Firma y tiempo de expiración (1 hora como pide el examen)
jwt.secret=EcoReciclaSuperSecretaClave2026ParaElExamenDeMovilesUpeu!
jwt.expiration=3600000